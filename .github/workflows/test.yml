name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build TipTap bundle
        run: npm run build:tiptap

      - name: Check committed TipTap bundle
        run: git diff --exit-code -- public/assets/lib/tiptap/tiptap-bundled.js public/assets/lib/tiptap/tiptap-bundled.js.map

      - name: Run backend smoke tests
        run: npm test
