services:
  # Node.js backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webinar-backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
      - SLIDES_DIR=/app/slides
      - ASSETS_DIR=/app/assets
      - TTS_SERVICE_URL=http://tts:5000
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./slides:/app/slides
      - ./assets:/app/assets
    networks:
      - webinar-network
    depends_on:
      - tts
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Piper TTS Service
  tts:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    container_name: webinar-tts
    restart: unless-stopped
    environment:
      - PORT=5000
      - TTS_CACHE_DIR=/app/cache
      - MODELS_DIR=/app/models
      - TTS_QUALITY=medium
    volumes:
      - tts-cache:/app/cache
      - tts-models:/app/models
    networks:
      - webinar-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # LibreOffice for PPTX conversion
  # Note: LibreOffice is now installed directly in the backend container
  # This separate service is no longer needed and can be removed
  # libreoffice:
  #   image: linuxserver/libreoffice:latest
  #   container_name: webinar-libreoffice
  #   restart: unless-stopped
  #   environment:
  #     - PUID=${PUID:-1000}
  #     - PGID=${PGID:-1000}
  #     - TZ=Europe/Berlin
  #   volumes:
  #     - ./uploads:/app/uploads
  #     - ./slides:/app/slides
  #   networks:
  #     - webinar-network

networks:
  webinar-network:
    driver: bridge

volumes:
  tts-cache:
  tts-models:
