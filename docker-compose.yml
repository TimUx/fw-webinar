services:
  # Node.js backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webinar-backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
      - SLIDES_DIR=/app/slides
      - ASSETS_DIR=/app/assets
      - TTS_SERVICE_URL=http://tts:5000
      - ONLYOFFICE_URL=http://onlyoffice
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - BACKEND_URL=http://webinar-backend:3000
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./slides:/app/slides
      - ./assets:/app/assets
    networks:
      - webinar-network
    depends_on:
      - tts
      - onlyoffice
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Piper TTS Service
  tts:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    container_name: webinar-tts
    restart: unless-stopped
    environment:
      - PORT=5000
      - TTS_CACHE_DIR=/app/cache
      - MODELS_DIR=/app/models
      - TTS_QUALITY=medium
    volumes:
      - tts-cache:/app/cache
      - tts-models:/app/models
    networks:
      - webinar-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # OnlyOffice DocumentServer for PPTX/PDF conversion
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: webinar-onlyoffice
    restart: unless-stopped
    environment:
      # Note: JWT_ENABLED=false only disables JWT for document editing API
      # The conversion API still requires JWT tokens regardless of this setting
      - JWT_ENABLED=false
      # IMPORTANT: You must configure JWT_SECRET for conversion API to work
      # If not set, OnlyOffice will generate a random secret at startup
      # Run ./get-onlyoffice-jwt-secret.sh to retrieve the secret
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
    tmpfs:
      - /var/www/onlyoffice/Data/certs:mode=700
    networks:
      - webinar-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Legacy LibreOffice service - REMOVED
  # Note: LibreOffice has been replaced with OnlyOffice DocumentServer
  # OnlyOffice provides better slide rendering and more reliable conversion
  # libreoffice:
  #   image: linuxserver/libreoffice:latest
  #   container_name: webinar-libreoffice
  #   restart: unless-stopped
  #   environment:
  #     - PUID=${PUID:-1000}
  #     - PGID=${PGID:-1000}
  #     - TZ=Europe/Berlin
  #   volumes:
  #     - ./uploads:/app/uploads
  #     - ./slides:/app/slides
  #   networks:
  #     - webinar-network

networks:
  webinar-network:
    driver: bridge

volumes:
  tts-cache:
  tts-models:
  onlyoffice-data:
  onlyoffice-logs:
